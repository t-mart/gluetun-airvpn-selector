<button
  type="button"
  class="server-card"
  data-server
  data-name="{{ server.name }}"
  data-country="{{ server.country }}"
  data-city="{{ server.city }}"
  data-region="{{ server.region }}"
  data-bandwidth="{{ server.bandwidth }}"
  data-bandwidth-max="{{ server.bandwidth_max }}"
  data-users="{{ server.users }}"
  data-load="{{ server.load }}"
  data-flag="{{ server.flag }}"
  aria-label="Exclude {{ server.name }} from the selection"
>
  <div class="server-title">
    <span class="flag" title="{{ server.country_code|upper }}">{{ server.flag or server.country_code|upper }}</span>
    <strong>{{ server.name }}</strong>
  </div>
  <span>{{ server.city }}, {{ server.country }}</span>
  <small>{{ server.bandwidth|round|int }} / {{ server.bandwidth_max|round|int }} Mbps · {{ server.users|round|int }} users · {{ server.load|round|int }}% load</small>
</button>
